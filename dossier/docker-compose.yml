services:
  dossier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dossier
    ports:
      - "${HOST_PORT:-0}:3000"
    environment:
      - SESSION_SECRET=dossier-dev-secret-not-for-production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
